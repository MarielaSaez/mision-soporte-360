/* CENTRO DE OPERACIONES · RETROFUTURISTA */
:root{--bg:#030c0c;--panel:#061b19;--panel2:#06241f;--line:#1bc7a5;--text:#e8fff1;--dim:#a2c9bd;--cyan:#51f9d0;--gold:#ffbb46;--danger:#ff7763;--ok:#8bffbf}
body{background:radial-gradient(ellipse at 50% -30%,#104b39,#03100f 65%);font-family:system-ui,Arial,sans-serif}

h1,h2,h3,.tag,.section-title{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

.panel{padding:16px}.panel h3{margin-top:0;color:#84ffd2}
button{background:#092d27;border-color:#1ba987;border-radius:5px;color:#b9ffdf}
button:hover:not(:disabled){background:#145845;box-shadow:0 0 12px #23eabb32}
.primary{background:linear-gradient(120deg,#ffd17c,#e7a531);color:#231601;border-color:#ffd47b;text-shadow:none;box-shadow:0 0 13px #ffc24d34}
.primary:hover:not(:disabled){background:#ffce6d}
.ghost{border-color:#317765}.pill{background:#0a382c;color:#b0fbd5;border:1px solid #1a8b69}.bigtime{font-family:ui-monospace,monospace;color:#ffba3e;text-shadow:0 0 15px #ff9b1182;font-size:1.65rem}

const STORE='soporte360_dual_v3';
let state;try{state=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){};
function emptyGame(){return{started:false,startAt:null,seconds:5400,penalties:0,hints:0,reviews:[],name:'',m0:{known:'',hyp:'',test:''},records:{},completed:[],scores:0,finishAt:null}}
if(!state||!state.games){state={mode:'competencia',op:'ALFA',screen:'home',selected:null,games:{ALFA:emptyGame(),BETA:emptyGame()}}}
for(const op of ['ALFA','BETA'])if(!state.games[op])state.games[op]=emptyGame();
const $=id=>document.getElementById(id), game=()=>state.games[state.op], mission=id=>CASES.cases.find(x=>x.id===id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rec(id){const g=game();if(!g.records[id])g.records[id]={hyp:'',notes:'',checks:[],attempts:0,diag:null,assessment:'',analysis:'',codeAttempts:0,opened:false,hintUsed:false};return g.records[id]}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){console.warn('No se guardó el progreso',e)}}
function tick(){const g=game();if(g.started&&g.startAt&&!g.finishAt){const elapsed=Math.floor((Date.now()-g.startAt)/1000);return Math.max(0,g.seconds-elapsed)}return g.started?g.seconds:5400}
function format(t){let a=Math.max(0,Math.floor(t));return `${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`}
function header(){const g=game(),t=tick(),p=g.completed.length;return `<div><b>▣ MISIÓN SOPORTE TÉCNICO 360°</b><div class="tiny muted">CENTRO DE OPERACIONES · ${state.op} · ${state.mode==='competencia'?'COMPETENCIA':'SEGUNDA RONDA'}</div></div><div class="flex"><span class="pill">${p}/7 TICKETS</span><span id="clock" class="bigtime ${t<600?'badtime':''}" aria-live="off">${format(t)}</span><button class="ghost" onclick="navigate('dashboard')">▤ Tickets</button><button class="ghost" onclick="navigate('library')">▤ Biblioteca</button><button class="ghost" onclick="navigate('home')">⌂ Inicio</button></div>`}
function navigate(screen,id){state.screen=screen;state.selected=id||null;save();render();window.scrollTo({top:0,behavior:'instant'})}
function render(){ $('top').innerHTML=header();const s=state.screen; if(s==='home')home();else if(s==='m0')mission0();else if(s==='dashboard')dashboard();else if(s==='case')caseView();else if(s==='library')library();else if(s==='final')finalView();else home(); updateClock() }
function home(){const a=state.games.ALFA,b=state.games.BETA;$('view').innerHTML=`<section class="hero"><span class="tag">CENTRO DE RESPUESTA · ENTORNO SIMULADO</span><h1>MISIÓN SOPORTE<br>TÉCNICO 360°</h1><h2>El rescate de la infraestructura digital</h2><p>Tu equipo es la mesa de ayuda de una institución educativa ficticia. Analizá las evidencias en video, formulá hipótesis antes de consultar a la IA, elegí pruebas, justificá el diagnóstico y descifrá un candado de cuatro dígitos para avanzar.</p><div class="flex"><span class="pill">14 incidentes · 2 operaciones</span><span class="pill">17 videos incluidos</span><span class="pill">7 candados por operación</span></div></section><div class="grid"><div class="panel"><h2>01 · Elegí operación</h2><div class="stack"><button onclick="chooseOp('ALFA')" class="${state.op==='ALFA'?'primary':''}">OPERACIÓN ALFA · ${a.completed.length}/7 finalizadas</button><button onclick="chooseOp('BETA')" class="${state.op==='BETA'?'primary':''}">OPERACIÓN BETA · ${b.completed.length}/7 finalizadas</button></div><p class="muted tiny">Cada operación guarda su avance de forma independiente en este navegador.</p></div><div class="panel"><h2>02 · Modalidad</h2><select onchange="setMode(this.value)"><option value="competencia" ${state.mode==='competencia'?'selected':''}>Competencia simultánea por equipos</option><option value="secuencial" ${state.mode==='secuencial'?'selected':''}>Desafío secuencial y superación</option></select><p>Se puede jugar por equipos en distintas computadoras y luego intercambiar la operación. El seguimiento es local: no existe sincronización entre dispositivos.</p></div></div><div class="panel"><h2>03 · Acceso al centro de operaciones</h2><label>Identificador del equipo (sin nombres completos ni datos personales)</label><input id="team" type="text" maxlength="42" placeholder="Ej.: Equipo Cóndor" value="${esc(game().name)}"><div class="flex"><button class="primary" onclick="startGame()">${game().started?'Continuar operación':'Iniciar misión 0'}</button><button onclick="navigate('library')">Consultar biblioteca técnica</button></div><p class="muted tiny">La Misión 0 es individual y sin IA; se registra una vez por equipo en este dispositivo. Tiempo total inicial: 90 minutos. El reloj avanza mientras el juego permanece abierto y también durante interrupciones si el navegador conserva el progreso.</p></div>`}
function chooseOp(op){state.op=op;save();render()};function setMode(mode){state.mode=mode;save();render()}
function startGame(){game().name=($('team').value||'Equipo sin nombre').trim().slice(0,42);if(!game().started){game().started=true;game().startAt=Date.now()}save();navigate(game().m0.hyp?'dashboard':'m0')}
function mission0(){const m=game().m0;$('view').innerHTML=`<div class="scene-banner"><span class="tag">MISIÓN 0 · INDIVIDUAL · SIN IA</span><span class="ops-small">INC-000 · PROTOCOLO DE OBSERVACIÓN</span></div><div class="dashboard-shell"><section class="ops-panel"><h2 class="ops-title">▤ Sistema de tickets</h2><button class="ticket-item active"><span class="ticket-number">INC-000</span><span class="status-chip">INICIAL</span><span class="ticket-name">No se puede acceder a páginas web</span></button><p class="ops-small">Esta etapa no tiene penalizaciones. Formulá hipótesis antes de entrar a las misiones.</p><button class="manual-button" onclick="navigate('library')">▤ Biblioteca técnica</button></section><section class="ops-panel"><h2 class="ops-title">▣ VIDEO DE LA FALLA · INC-000</h2><video class="video" controls playsinline preload="metadata" src="videos/3-%20Problema%20de%20Conectividad.mp4"></video><div class="player-brief">Desde Secretaría informan que el equipo inicia sesión, pero el navegador no carga páginas. El video ilustra el síntoma: todavía no se conoce la causa.</div></section><section class="ops-panel amber"><h2 class="ops-title">&gt;_ CONSOLA DE DIAGNÓSTICO</h2><pre class="console-output">HELPDESK OS 2.0\nINC-000 • ESTADO: ABIERTO\n\nREPORTE DEL USUARIO:\n«La computadora enciende pero no puedo abrir páginas».\n\nEVIDENCIA DISPONIBLE:\n• El equipo inicia sesión.\n• El navegador no carga sitios.\n\n[ANTES DE UTILIZAR IA]\nRegistrá tres hipótesis y una prueba segura.</pre></section></div><div class="ops-lower"><section class="ops-panel"><h2 class="ops-title">▤ Biblioteca técnica</h2><p class="ops-small">Los manuales y recursos están incorporados en el juego.</p><button class="manual-button" onclick="navigate('library')">› Redes IPv4 / conectividad</button><button class="manual-button" onclick="navigate('library')">› Procedimiento diagnóstico</button><p class="muted tiny">No tenés que cargar ningún video.</p></section><section class="ops-panel"><h2 class="ops-title">▤ REGISTRO INDIVIDUAL DE DIAGNÓSTICO</h2><div class="diagnosis-grid"><div><label>1. ¿Qué sabemos y qué información falta?</label><textarea id="mknown">${esc(m.known)}</textarea></div><div><label>2. Escribí tres posibles causas</label><textarea id="mhyp">${esc(m.hyp)}</textarea></div><div><label>3. ¿Qué comprobarías primero y por qué?</label><textarea id="mtest">${esc(m.test)}</textarea></div><div><label>4. ¿Qué resultado esperás y qué harías si no se confirma?</label><textarea id="mexpected" placeholder="Reflexión opcional"></textarea></div></div><button class="primary" onclick="saveM0()">➜ ENTREGAR HIPÓTESIS E INGRESAR</button><p class="ops-small">Esta es una evaluación inicial del razonamiento, no una prueba de rapidez.</p></section></div>`}
function saveM0(){let m=game().m0;m.known=$('mknown').value.trim();m.hyp=$('mhyp').value.trim();m.test=$('mtest').value.trim();if(m.known.length<10||m.hyp.length<20||m.test.length<15){alert('Completá las tres respuestas con información suficiente antes de avanzar.');return}save();navigate('dashboard')}
function dashboard(){const g=game(),pool=CASES.cases.filter(c=>c.op===state.op);const tiles=pool.map((c,i)=>{const unlocked=i===0||g.completed.includes(pool[i-1].id),done=g.completed.includes(c.id),r=g.records[c.id]||{};return `<button class="ticket-item ${done?'done':''} ${!unlocked?'locked':''}" ${!unlocked?'disabled':''} onclick="navigate('case','${c.id}')"><span class="ticket-number">TK-${c.id}</span><span class="status-chip">${done?'✓ RESUELTO':unlocked?'ABIERTO':'🔒'}</span><span class="ticket-name">${esc(c.title)}</span><span class="ops-small">${r.attempts||0} fallos</span></button>`}).join('');const q=g.completed.length;$('view').innerHTML=`<div class="scene-banner"><div><span class="tag">CENTRO DE OPERACIONES · ${state.op}</span><h1>Panel de tickets</h1></div><button onclick="downloadReport()">▤ Descargar memoria técnica</button></div><div class="ops-stats"><span>AVANCE: ${q}/7</span><span>TIEMPO: <b id="dashboardClock">${format(tick())}</b></span><span>PUNTOS: ${g.scores}</span><span>PENALIZACIONES: ${g.penalties}</span><span>PISTAS: ${g.hints}</span></div><div class="dashboard-shell" style="margin-top:15px"><section class="ops-panel"><h2 class="ops-title">▤ SISTEMA DE TICKETS</h2><div class="ticket-list">${tiles}</div></section><section class="ops-panel"><h2 class="ops-title">▣ FEED DE OPERACIONES</h2><div class="alert">Seleccioná un ticket abierto para visualizar el video y las pruebas. Los tickets siguientes están bloqueados hasta validar la clave de cuatro dígitos.</div><div class="bar" style="margin:16px 0"><div style="width:${q*100/7}%"></div></div><p>Los casos se resuelven mediante una secuencia de observación, hipótesis, pruebas, auditoría de IA y código de validación.</p><p>Operación <b>${state.op}</b> · ${state.mode==='competencia'?'Competencia simultánea':'Desafío secuencial'}</p><button onclick="navigate('m0')">Revisar misión 0</button>${q===7?`<button class="primary" onclick="navigate('final')">🏆 Ver logros</button>`:''}</section><section class function caseView(){const c=mission(state.selected),g=game();if(!c||c.op!==state.op)return navigate('dashboard');const pool=CASES.cases.filter(x=>x.op===state.op),ix=pool.findIndex(x=>x.id===c.id);if(ix>0&&!g.completed.includes(pool[ix-1].id))return navigate('dashboard');const r=rec(c.id),completed=g.completed.includes(c.id),gate=r.diag===c.correct&&r.analysis.trim().length>=15&&Boolean(r.assessment)&&r.labSolved&&r.clientDone,showPuzzle=gate&&r.checks.length===4;const tiles=pool.map((x,i)=>{const open=i===0||g.completed.includes(pool[i-1].id);return `<button class="ticket-item ${x.id===c.id?'active':''} ${g.completed.includes(x.id)?'done':''} ${!open?'locked':''}" ${!open?'disabled':''} onclick="navigate('case','${x.id}')"><span class="ticket-number">TK-${x.id}</span><span class="status-chip">${g.completed.includes(x.id)?'✓':open?'ABIERTO':'🔒'}</span><span class="ticket-name">${esc(x.title)}</span></button>`}).join('');const tests=c.tests.map((t,i)=>`<button class="test ${r.checks.includes(i)?'visited':''}" onclick="checkTest(${i})">${r.checks.includes(i)?'✓ ':'▸ '}${esc(t.name)}</button>${r.checks.includes(i)?`<div class="evidence"><strong>PRUEBA ${i+1}</strong><p>${esc(t.result)}</p><span class="seal">Sello ${t.seal}: ${t.value}</span></div>`:''}`).join('');const options=c.choices.map((v,i)=>`<button class="choice" onclick="setDiagnosis(${i})" ${completed?'disabled':''}>${esc(v)} ${r.diag===i?'◀':''}</button>`).join('');$('view').innerHTML=`<div class="scene-banner"><span class="tag">OPERACIÓN ${c.op} · TK-${c.id} · ${ix+1}/7</span><div class="ops-stats"><span>🔐 ${g.completed.length}/7 ABIERTOS</span><span>★ ${g.scores} PTS</span><span>−2 MIN / ERROR</span></div></div><div class="dashboard-shell"><section class="ops-panel"><h2 class="ops-title">▤ SISTEMA DE TICKETS</h2><div class="ticket-list">${tiles}</div></section><section class="ops-panel"><h2 class="ops-title">▣ VIDEO DE LA FALLA <span class="ops-small">· TK-${c.id}</span></h2><video class="video" controls preload="metadata" playsinline src="${esc('videos/'+encodeURIComponent(c.video))}">Tu navegador no soporta MP4.</video><div class="player-brief">${esc(c.brief)}</div><div class="ops-small">La grabación muestra síntomas, no una causa necesariamente demostrada.</div></section><section class="ops-panel amber"><h2 class="ops-title">&gt;_ CONSOLA DE DIAGNÓSTICO</h2><pre class="console-output" id="consoleLog">HELPDESK OS v2.04\nTK-${c.id} · ${esc(c.title)}\n\n> Incidente recibido\n> Pruebas disponibles: ${c.tests.length}\n> Pruebas revisadas: ${r.checks.length}\n\nEscribí AYUDA para consultar comandos.</pre><div class="terminal-prompt"><span>C:\&gt;</span><input id="terminalInput" type="text" placeholder="ayuda · pruebas · estado · ipconfig · ping" onkeydown="if(event.key==='Enter')runTerminal()"><button onclick="runTerminal()">EJECUTAR</button></div><p class="ops-small">Consola simulada: no ejecuta comandos reales.</p></section></div><div class="ops-lower"><section class="ops-panel"><h2 class="ops-title">▤ BIBLIOTECA TÉCNICA</h2><details><summary>Manual POST / ASUS</summary><div class="reveal-manual">1 corto: inicio normal; 1 largo + 2 cortos: posible anomalía RAM; 1 largo + 3 cortos: anomalía gráfica. Los pitidos varían según modelo y firmware.</div></details><details><summary>Red IPv4 y DNS</summary><div class="reveal-manual">Verificá dirección IP, máscara, puerta de enlace, DNS y duplicados. <code>ipconfig /all</code>, <code>ping</code>, <code>nslookup</code> ayudan a diferenciar causas.</div></details><details><summary>Disco SMART y arranque</summary><div class="reveal-manual">El estado SMART ayuda a evaluar la unidad. Disk Boot Failure también puede deberse a prioridad de arranque, USB o sistema instalado.</div></details><details><summary>Procedimiento seguro</summary><div class="reveal-manual">No manipular la PSU energizada, ni mirar extremos de fibra óptica. Todas las intervenciones aquí son simuladas.</div></details><button class="manual-button" onclick="navigate( div>`:!showPuzzle?`<div class="alert">Reuní los cuatro sellos. Restan ${4-r.checks.length} pruebas.</div>`:`<p>Tomá la <b>última cifra</b> de cada sello y ordenalas así: <strong class="seal">${esc(c.order.split('').join(' · '))}</strong></p><div class="flex"><input id="code" inputmode="numeric" maxlength="4" autocomplete="off" class="codeinput" type="text" placeholder="0000"><button class="primary" onclick="verifyCode()">➜ DESBLOQUEAR</button></div><div id="codeFeedback"></div>`}<p class="ops-small">${r.codeAttempts} intentos · −30 segundos por código incorrecto.</p></section></div>`}
function field(key,value){const r=rec(state.selected);r[key]=value;save()}
function checkTest(i){const r=rec(state.selected);if(!r.checks.includes(i))r.checks.push(i);save();render()}
function showHint(){const r=rec(state.selected);if(r.hintUsed){render();return}r.hintUsed=true;const g=game();g.hints++;g.scores-=10;g.seconds=Math.max(0,g.seconds-60);save();render()}
function setDiagnosis(i){const c=mission(state.selected),r=rec(c.id),g=game();if(g.completed.includes(c.id))return;if(r.hyp.trim().length<12||r.notes.trim().length<18||r.checks.length<2){alert('Antes de responder, registrá tu hipótesis, un razonamiento con evidencias y al menos dos pruebas.');return}r.diag=i;if(i!==c.correct){r.attempts++;g.penalties++;g.seconds=Math.max(0,g.seconds-120);g.scores-=25;g.reviews.push({caseId:c.id,text:['No resolvieron el problema y perdimos tiempo de trabajo.','El diagnóstico no estaba respaldado por las pruebas.','Necesitamos una solución verificada, no una suposición.'][r.attempts%3]});save();render();alert('Diagnóstico no sustentado. El cliente dejó una reseña negativa y se descontaron 2 minutos. Podés ampliar las pruebas y volver a intentar.');return}save();render()}
function verifyCode(){const c=mission(state.selected),r=rec(c.id),g=game();if(!c||r.diag!==c.correct||r.checks.length<4||r.analysis.trim().length<15||!r.assessment||!r.labSolved||!r.clientDone){alert('Falta completar las pruebas, el laboratorio, la atención al cliente o la auditoría de IA.');return}const input=$('code').value.replace(/\D/g,'');r.codeAttempts++;if(input!==c.validation){g.seconds=Math.max(0,g.seconds-30);save();$('codeFeedback').innerHTML='<div class="alert bad">Código incorrecto. Se descontaron 30 segundos. Revisá el orden de los sellos y sus últimas cifras.</div>';updateClock();return}r.opened=true;g.completed.push(c.id);g.scores+=100;if(g.completed.length===7)g.finishAt=Date.now();save();if(g.completed.length===7)navigate('final');else {alert('✔ Candado abierto. +100 puntos. Se desbloqueó el siguiente incidente.');navigate('dashboard')}}
function library(){const extra=CASES.extras.map(([src,desc])=>`<div class="panel"><strong>${esc(desc)}</strong><div class="muted tiny">${esc(src)}</div><video class="video" preload="none" controls src="${esc('videos/'+encodeURIComponent(src))}"></video></div>`).join('');$('view').innerHTML=`<span class="tag">DOCUMENTACIÓN DISPONIBLE EN LA SIMULACIÓN</span><h1>Biblioteca técnica</h1><div class="panel"><h2>POST de la placa madre · perfil ASUS del laboratorio</h2><p>Guía didáctica simplificada basada en una familia de placas ASUS; <b>no es un manual oficial ni sirve para todos los modelos</b>. Antes de usarla fuera del juego se debe comprobar la referencia exacta del modelo.</p><table style="width:100%;border-collapse:collapse;line-height:2"><thead><tr><th style="text-align:left">Señal</th><th style="text-align:left">Posible interpretación de este perfil</th></tr></thead><tbody><tr><td>1 pitido corto</td><td>Arranque normal</td></tr><tr><td>1 largo + 2 cortos</td><td>Anomalía RAM</td></tr><tr><td>1 largo + 3 cortos</td><td>Anomalía gráfica</td></tr><tr><td>1 largo + 4 cortos</td><td>Comprobar ventilación, temperatura o voltaje de CPU</td></tr></tbody></table><div class="alert">La secuencia de pitidos del video debe contrastarse con el fabricante y el modelo real; el caso B04 usa expresamente el perfil didáctico de laboratorio. Un sonido aislado no demuestra RAM defectuosa.</div><p class="muted tiny">Guía de referencia: <a href="https://www.asus.com/support/faq/1029959/" target="_blank" rel="noopener">Soporte ASUS · FAQ 1029959</a></p></div><div class="grid"><div class="panel"><h2>Consola de redes · comandos simulados</h2><p><code>ipconfig /all</code>: dirección IPv4, máscara, DNS, puerta de enlace y DHCP.</p><p><code>ping 192.168.10.1</code>: prueba de respuesta de un equipo en red.</p><p><code>nslookup nombre.example</code>: consulta de resolución DNS.</p><p>No se ejecutan comandos en tu dispositivo: son resultados fijos dentro de cada ticket.</p></div><div class="pan function finalView(){const g=game();if(g.completed.length!==7)return navigate('dashboard');const achievements=[['🏅 Infraestructura recuperada',true],['🧠 Diagnóstico limpio',g.penalties===0],['🔍 Investigación autónoma',g.hints===0],['🤝 Auditoría responsable',CASES.cases.filter(x=>x.op===state.op).every(x=>(g.records[x.id]||{}).analysis?.length>=15)]];$('view').innerHTML=`<div class="hero" style="text-align:center"><span class="successbig">🏆</span><span class="tag">OPERACIÓN ${state.op} FINALIZADA</span><h1>Infraestructura recuperada</h1><p>El equipo ${esc(g.name)} logró desbloquear los siete tickets. Cada resolución se sostuvo con pruebas, una auditoría crítica de IA y una clave técnica.</p><div class="grid three"><div><h2>${g.scores}</h2>puntos</div><div><h2>${g.penalties}</h2>diagnósticos incorrectos</div><div><h2>${format(g.seconds-Math.floor(((g.finishAt||Date.now())-g.startAt)/1000))}</h2>tiempo final</div></div></div><div class="panel"><h2>Logros</h2>${achievements.map(([n,ok])=>`<p>${ok?'✅':'⬜'} ${n}</p>`).join('')}<button class="primary" onclick="downloadReport()">📄 Descargar Memoria Técnica y Prompt-Log</button> <button onclick="navigate('home')">Elegir otra operación</button></div>`}
function downloadReport(){const g=game(),pool=CASES.cases.filter(x=>x.op===state.op);let out=['MISIÓN SOPORTE TÉCNICO 360° · MEMORIA TÉCNICA','Operación: '+state.op,'Equipo: '+g.name,'Modalidad: '+state.mode,'Incidentes validados: '+g.completed.length+'/7','Puntuación: '+g.scores,'Penalizaciones: '+g.penalties,'Pistas: '+g.hints,'Reseñas negativas: '+g.reviews.length,'','MISIÓN 0','Qué sabemos y falta: '+g.m0.known,'Hipótesis: '+g.m0.hyp,'Prueba inicial: '+g.m0.test,''];for(const c of pool){const r=g.records[c.id]||{};out.push('--- '+c.id+' '+c.title+' ---','Hipótesis: '+(r.hyp||''),'Pruebas consultadas: '+(r.checks||[]).map(i=>c.tests[i]?.name).join('; '),'Evidencias y razonamiento: '+(r.notes||''),'Diagnóstico propuesto: '+(typeof r.diag==='number'?c.choices[r.diag]:'No registrado'),'Conclusión y evidencia registrada: '+(r.notes||''),'Auditoría de IA: '+(r.assessment||''),'Fundamentación: '+(r.analysis||''),'Fallos de diagnóstico: '+(r.attempts||0),'Candado validado: '+(r.opened?'Sí':'No'),'')}out.push('REFLEXIÓN FINAL: ¿Qué cambió entre las hipótesis iniciales y las decisiones finales?','Esta memoria registra resultados de un simulador, no intervenciones reales.');const blob=new Blob([out.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Memoria_Tecnica_'+state.op+'_'+(g.name||'equipo').replace(/[^\w\-]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
function runTerminal(){const inp=$('terminalInput'),out=$('consoleLog');if(!inp||!out)return;const cmd=inp.value.trim().toLowerCase(),c=mission(state.selected),r=rec(state.selected);if(!cmd)return;let answer;if(cmd==='ayuda'||cmd==='help'){answer='COMANDOS: ayuda, estado, pruebas, evidencia, ipconfig /all, ping, nslookup, clear';}else if(cmd==='estado'){answer=`TICKET ${c.id}\nPruebas realizadas: ${r.checks.length}/4\nDiagnósticos fallidos: ${r.attempts}\nCandado: ${r.opened?'ABIERTO':'BLOQUEADO'}`;}else if(cmd==='pruebas'){answer=c.tests.map((t,i)=>`${i+1}. ${t.name}${r.checks.includes(i)?' [CONSULTADA]':''}`).join('\n')+'\nPara ejecutar una prueba utilizá los botones del laboratorio.';}else if(cmd==='evidencia'){answer=r.checks.length?r.checks.map(i=>c.tests[i].result).join('\n'):'Todavía no se registraron resultados.';}else if(cmd==='clear'||cmd==='cls'){out.textContent='HELPDESK OS v2.04\nTerminal reiniciada.';inp.value='';return;}else if(/^(ipconfig|ping|nslookup)/.test(cmd)){answer=c.id==='A03'||c.id==='B03'||/red|conex|ip|dns/i.test(c.title)?'Resultados de red disponibles mediante las pruebas de este incidente. Consultá el laboratorio para ver los datos de simulación.':'Comando de red disponible, pero este ticket requiere otro tipo de prueba.';}else{answer='Comando no reconocido. Escribí ayuda.';}out.textContent+=`\n\nC:\\> ${cmd}\n${answer}`;inp.value='';out.scrollTop=out.scrollHeight;}

// v4 - extended game, no external services or real device commands
const V4_PARAMS=new URLSearchParams(location.search);
const V4_RULES={minutes:Math.min(180,Math.max(20,Number(V4_PARAMS.get('min'))||90)),penalty:Math.min(10,Math.max(0,Number(V4_PARAMS.get('pen'))||2)),hints:V4_PARAMS.get('hints')!=='off'};
let v4Audio=false;
function v4Beep(success=true){if(!v4Audio)return;try{const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='square';osc.frequency.value=success?660:175;gain.gain.setValueAtTime(.05,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.16);setTimeout(()=>ctx.close(),250)}catch(e){}}
function v4Rec(){let r=rec(state.selected);if(!('labSolved'in r))r.labSolved=false;if(!('clientDone'in r))r.clientDone=false;if(!('clientAnswer'in r))r.clientAnswer=null;if(!('labAttempts'in r))r.labAttempts=0;if(!('clientScore'in r))r.clientScore=0;return r}
const v4OriginalCase=caseView;
caseView=function(){v4OriginalCase();const c=mission(state.selected);if(!c)return;const r=v4Rec(),spec=V4_PUZZLES[c.id];if(!spec)return;const [question,opts,correct,diagnostic]=spec;
 const lab=`<section class="v4-card"><h3>⚙ LABORATORIO TÉCNICO VIRTUAL</h3><div class="v4-circuit">SIMULADOR • ${esc(c.id)}<br>${esc(diagnostic)}<br>ESTADO: ${r.labSolved?'PROCEDIMIENTO VALIDADO':'A LA ESPERA DE INTERVENCIÓN'}</div><p>${esc(question)}</p>${opts.map((o,i)=>`<button class="v4-option" ${r.labSolved?'disabled':''} onclick="v4Lab(${i})">${i+1} · ${esc(o)}</button>`).join('')}<div class="v4-status ${r.labSolved?'':'v4-error'}">${r.labSolved?'✓ Procedimiento validado. +20 puntos.':'Seleccioná la intervención segura. Una decisión errónea obliga a reconsiderar la prueba.'}</div></section>`;
 const ctext=V4_CLIENTS[c.id];const client=`<section class="v4-card client"><h3>☏ CLIENTE EN LÍNEA</h3><p>${esc(ctext)}</p><div class="v4-help">Elegí una respuesta profesional para el usuario. El resultado queda registrado.</div>${['Entiendo la situación. Primero voy a verificar la causa con pruebas seguras; te informaré lo que encuentre.','Seguro que es eso: voy a reemplazar componentes sin hacer pruebas.','No es mi problema. Probá reiniciar todo varias veces.'].map((a,i)=>`<button class="v4-option" ${r.clientDone?'disabled':''} onclick="v4Client(${i})">${String.fromCharCode(65+i)} · ${esc(a)}</button>`).join('')}<div class="v4-status ${r.clientDone&&r.clientAnswer!==0?'v4-error':''}">${r.clientDone?(r.clientAnswer===0?'✓ Comunicación profesional: +15 puntos.':'⚠ Se registró una respuesta poco profesional; revisá la comunicación con usuarios.'):'Pendiente: atención al usuario.'}</div></section>`;
 const toolbar=`<div class="v4-toolbar"><button class="ghost" onclick="v4Audio=!v4Audio;this.textContent=v4Audio?'♫ Sonido activado':'♫ Sonido desactivado'">♫ Sonido ${v4Audio?'activado':'desactivado'}</button><button class="ghost" onclick="v4Export()">⬇ Exportar informe del equipo (.json)</button><span class="v4-help">Los sonidos se activan voluntariamente y no contienen música comercial.</span></div>`;
 const lower=document.querySelector('.ops-lower');if(lower)lower.insertAdjacentHTML('beforebegin',toolbar+'<div class="v4-grid">'+lab+client+'</div>');
 if(!r.labSolved||!r.clientDone){const alertPanel=document.querySelector('.ops-lower .ops-panel:nth-child(2)');if(alertPanel)alertPanel.insertAdjacentHTML('beforeend','<div class="v4-status v4-error">Para abrir el candado también debés completar el laboratorio virtual y la atención al cliente. Al terminar, volvé a revisar el candado.</div>');}
}
function v4Lab(i){const c=mission(state.selected),r=v4Rec(),g=game(),p=V4_PUZZLES[c.id];if(r.labSolved)return;r.labAttempts++;if(i===p[2]){r.labSolved=true;g.scores+=20;v4Beep(true)}else{g.scores-=5;v4Beep(false)}save();caseView();if(i!==p[2]){const node=document.querySelector('.v4-card .v4-status');if(node)node.textContent='⚠ La intervención no está justificada. Compará los resultados de las pruebas y volvé a intentarlo.';}}
function v4Client(i){const r=v4Rec(),g=game();if(r.clientDone)return;r.clientDone=true;r.clientAnswer=i;r.clientScore=i===0?15:0;g.scores+=r.clientScore;if(i>0)g.reviews.push({caseId:state.selected,text:'Comunicación poco profesional: faltó explicar el procedimiento y la seguridad al usuario.'});v4Beep(i===0);save();caseView()}
function v4TerminalResponse(c,cmd){
 const results={
 A01:{'rtc':'Batería RTC simulada: 2,1 V. Fecha reiniciada tras desconexión.','uefi':'Fecha y hora vuelven a valores antiguos después de cortar corriente.'},
 A02:{'uefi':'Unidad interna DETECTADA. ORDEN BOOT: USB removible > SSD interno.','smart':'SMART: sin alerta en la simulación.'},
 A03:{'ipconfig /all':'IPv4: 192.168.1.24/24\nGateway: 192.168.1.1\nDNS configurado: 192.168.1.254 (no responde).','ping 192.168.1.1':'Respuesta desde 192.168.1.1: 4/4 recibidos.','ping 1.1.1.1':'Respuesta desde 1.1.1.1: 4/4 recibidos.','nslookup':'DNS request timed out. El servidor DNS no respondió.'},
 A04:{'sensores':'CPU reposo 43 °C / bajo carga 94 °C. Ventilador alto.','temperatura':'La temperatura sube durante tareas intensivas; investigar refrigeración.'},
 A05:{'procesos':'Proceso sospechoso: update_helper32.exe; múltiples ventanas emergentes. Aislar y verificar.','antivirus':'Resultado simulado: software potencialmente no deseado detectado.'},
 A06:{'video':'Monitor A sin imagen con dos equipos; monitor B funciona con la PC afectada.','prueba cruzada':'Salida de video de la PC funcional con monitor comprobado.'},
 A07:{'fuente':'Interruptor exterior de fuente en posición O (apagado).','energia':'Sin señal de alimentación hasta cambiar el interruptor de forma segura.'},
 B01:{'rtc':'Fecha UEFI restablecida sin alimentación; batería RTC envejecida.','uefi':'La fecha ajustada vuelve a perderse tras desenchufar el equipo.'},
 B02:{'video':'Imagen normal al sustituir el cable HDMI. El monitor funciona.','cable':'Cable original falla; cable comprobado recupera la señal.'},
 B03:{'ipconfig /all':'PC-A: 192.168.10.44 / 255.255.255.0\nPC-B: 192.168.10.44 / 255.255.255.0\nPuerta de enlace: 192.168.10.1\n192.168.10.45 libre.','ping 192.168.10.44':'Respuestas intermitentes: dos dispositivos anuncian la misma dirección.','arp -a':'192.168.10.44 presenta MAC distintas en sucesivas consultas (simulación).'},
 B04:{'post':'Perfil didáctico ASUS: comprobar RAM. 1 largo + 2 cortos puede relacionarse con RAM según familia/modelo.','memoria':'Inspección segura: módulo no asentado correctamente; equipo apagado y desconectado.'},
 B05:{'df -h':'Unidad del sistema: 100 GB / 99 GB usados / 1 GB libre.','dir':'Registros temporales de gran tamaño detectados; no borrar archivos institucionales al azar.'},
 B06:{'usb':'Puertos posteriores funcionan; uno frontal desencadena desconexiones.','puertos':'Aislar el puerto frontal defectuoso antes de concluir falla de PSU.'},
 B07:{'ping 192.168.10.1':'Pérdidas con cable original. 0% pérdida con cable de referencia.','cable':'Cable de par trenzado original falla en prueba cruzada.'}
 };
 const mapped=results[c.id]||{};if(Object.prototype.hasOwnProperty.call(mapped,cmd))return mapped[cmd];
 for(const [key,value] of Object.entries(mapped)){if(cmd.startsWith(key+' '))return value}
 if(cmd==='comandos')return 'Comandos de este ticket: '+Object.keys(mapped).join(', ');
 if(cmd==='ipconfig /all'||cmd==='ping'||cmd.startsWith('ping ')||cmd.startsWith('nslookup'))return 'Esta prueba no aporta información determinante en el ticket actual. Consultá COMANDOS.';
 return null
}
runTerminal=function(){const inp=$('terminalInput'),out=$('consoleLog');if(!inp||!out)return;const cmd=inp.value.trim().toLowerCase().replace(/\s+/g,' '),c=mission(state.selected),r=v4Rec();if(!cmd)return;let ans;
 if(['ayuda','help'].includes(cmd))ans='COMANDOS: ayuda, comandos, estado, pruebas, evidencia, limpiar. Cada ticket incluye comandos simulados propios. Escribí COMANDOS para verlos.';
 else if(cmd==='comandos')ans=v4TerminalResponse(c,'comandos');
 else if(cmd==='estado')ans=`TICKET ${c.id}\nPruebas: ${r.checks.length}/4\nLaboratorio: ${r.labSolved?'APROBADO':'PENDIENTE'}\nCliente: ${r.clientDone?'ATENDIDO':'PENDIENTE'}\nCandado: ${r.opened?'ABIERTO':'CERRADO'}`;
 else if(cmd==='pruebas')ans=c.tests.map((t,i)=>`${i+1}. ${t.name}${r.checks.includes(i)?' [REALIZADA]':''}`).join('\n');
 else if(cmd==='evidencia')ans=r.checks.length?r.checks.map(i=>c.tests[i].result).join('\n'):'No hay evidencias registradas todavía.';
 else if(['limpiar','clear','cls'].includes(cmd)){out.textContent='HELPDESK OS v4.0 · CONSOLA REINICIADA';inp.value='';return}
 else ans=v4TerminalResponse(c,cmd)||'Comando no reconocido. Escribí AYUDA o COMANDOS.';
 out.textContent+=`\n\nC:\\> ${cmd}\n${ans}`;inp.value='';out.scrollTop=out.scrollHeight;v4Beep(true)}
function v4Export(){const g=game(),cases=CASES.cases.filter(c=>c.op===state.op);const payload={schema:'soporte360-v4',generatedAt:new Date().toISOString(),operation:state.op,team:g.name||'Equipo sin identificar',mode:state.mode,summary:{completed:g.completed.length,total:7,score:g.scores,penalties:g.penalties,hints:g.hints,reviews:g.reviews.length,secondsRemaining:tick()},mission0:g.m0,cases:cases.map(c=>{const r=g.records[c.id]||{};return{id:c.id,title:c.title,completed:!!r.opened,hypothesis:r.hyp||'',notes:r.notes||'',tests:(r.checks||[]).map(i=>c.tests[i].name),diagnosticChoice:Number.isInteger(r.diag)?c.choices[r.diag]:null,attempts:r.attempts||0,labSolved:!!r.labSolved,labAttempts:r.labAttempts||0,clientResponse:r.clientAnswer,clientPoints:r.clientScore||0,aiDecision:r.assessment||'',aiAnalysis:r.analysis||'',codeAttempts:r.codeAttempts||0}})};v4Download(JSON.stringify(payload,null,2),'Informe_'+state.op+'_'+(g.name||'equipo').replace(/[^a-z0-9_-]/gi,'_')+'.json','application/json')}
function v4Download(content,name,type){const blob=new Blob([content],{type:type+';charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const v4OriginalDashboard=dashboard;
dashboard=function(){v4OriginalDashboard();const panel=$('view');if(panel)panel.insertAdjacentHTML('afterbegin',`<div class="v4-toolbar"><button class="primary" onclick="v4Export()">⬇ Descargar informe del equipo (.json)</button><span class="v4-help">Entregá este archivo a tu docente. No se envía información automáticamente.</span></div>`)};
const v4OriginalFinal=finalView;
finalView=function(){v4OriginalFinal();$('view').insertAdjacentHTML('beforeend','<div class="panel"><h2>📋 Informe para la docente</h2><p>Descargá el informe JSON del equipo para que pueda importarse en el panel docente y compararse con otras partidas.</p><button class="primary" onclick="v4Export()">⬇ Descargar informe JSON</button></div>')};
const v4OriginalStart=startGame;
startGame=function(){const g=game();if(!g.started){g.seconds=V4_RULES.minutes*60}v4OriginalStart()};
const v4OriginalSetDiagnosis=setDiagnosis;
setDiagnosis=function(i){const before=game().penalties;v4OriginalSetDiagnosis(i);if(game().penalties>before){game().seconds=Math.max(0,game().seconds-(V4_RULES.penalty-2)*60);save();updateClock();v4Beep(false)}else v4Beep(true)};
const v4OriginalShowHint=showHint;
showHint=function(){if(!V4_RULES.hints){alert('Las pistas están desactivadas en esta partida.');return}v4OriginalShowHint()};

render();
</script></body></html>
